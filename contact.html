<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Gabrielle Latch | Where Art & Tech Merge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="mainHeader">
        <img src="assets/images/Me.jpg" id="profilePic" alt="Picture of Gabrielle Latch">
        <div id="hero">
            <h1>Hi, I'm Gabi</h1>
            <h2>Full-Stack Developer and Designer</h2>
        </div>
        <div id="heroLinks">
            <a href="https://github.com/NotSnowWhite"><img src="assets/icons/github.png" alt="Github icon" class="icons"
                    id="githubHeaderIcon">GitHub</a>
            <a href="https://www.linkedin.com/in/gabrielle-latch"><img src="assets/icons/linkedin1.png"
                    alt="LinkedIn icon" class="icons" id="linkedinHeaderIcon">LinkedIn</a>
            <a href="https://lokincity.com"><img src="assets/icons/galaxy.png" alt="Galaxy icon" class="icons"
                    id="galaxyHeaderIcon">LokinCity</a>
        </div>
    </header>
    <nav>
        <div id="navMenu">
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </div>

    </nav>
    <main>
        <section id="contact">
            <h2>Get In Touch</h2>
            <p>Wanna get in touch? Send me a message!</p>
            <form action="mailto:gflatch@att.net" method="POST" enctype="text/plain">
                <div id="formName">
                    <div id="formFName">
                        <label for="fName"> First Name:</label>
                        <input type="text" id="fName" name="fName" required>
                    </div>
                    <div id="formLName">
                        <label for="lName">Last Name:</label>
                        <input type="text" id="lName" name="lName" required>
                    </div>
                </div>
                <div id="formEmail">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div id="formMessage">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <div id="formSubmit">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <div id="footerCopyright">

        </div>

        </div>

        <div id="footerLinks">

                    class="icons" id="githubFooterIcon">GitHub</a>
            <a href="https://www.linkedin.com/in/gabrielle-latch"><img src="assets/icons/linkedin1.png"
                    alt="LinkedIn icon" class="icons" id="linkedinFooterIcon">LinkedIn</a>
            <a href="https://lokincity.com"><img src="assets/icons/galaxy.png" alt="Galaxy icon" class="icons"
                    id="galaxyFooterIcon">LokinCity</a>
        </div>
    </footer>
